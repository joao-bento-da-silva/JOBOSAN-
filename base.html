 {% extends "base.html" %}
{% block conteudo %}
<div class="area-batalha" style="display: flex; flex-direction: column; align-items: center; padding: 20px; color: #fff; background-color: #121212; min-height: 80vh;">
    <h2>🏰 Fuga dos Gladiadores no Castelo</h2>
    
    <div class="status-jogo" style="margin-bottom: 15px;">
        <p>Gladiadores: <span id="qtd-gladiadores">4</span> | Turno: <span id="turno-atual">1</span> / 20 | <a href="{{ url_for('painel') }}" style="color: #3498db;">Sair para o Painel</a></p>
    </div>

    <!-- Tabuleiro do Labirinto 8x8 -->
    <div id="tabuleiro-labirinto" style="display: grid; grid-template-columns: repeat(8, 45px); grid-template-rows: repeat(8, 45px); gap: 3px; background-color: #333; padding: 10px; border-radius: 8px; margin-bottom: 20px;"></div>

    <div class="painel-comandos" style="display: flex; flex-direction: column; align-items: center; gap: 10px; background: #1e1e1e; padding: 15px; border-radius: 8px; width: 100%; max-width: 350px;">
        <h3>Comandos do Gladiador</h3>
        <div class="botoes-direcao" style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <button class="btn-acao" onclick="moverGladiador('cima')" style="background-color: #2980b9; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">⬆️ Cima</button>
            <div style="display: flex; gap: 30px;">
                <button class="btn-acao" onclick="moverGladiador('esquerda')" style="background-color: #2980b9; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">⬅️ Esquerda</button>
                <button class="btn-acao" onclick="moverGladiador('direita')" style="background-color: #2980b9; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">➡️ Direita</button>
            </div>
            <button class="btn-acao" onclick="moverGladiador('baixo')" style="background-color: #2980b9; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">⬇️ Baixo</button>
        </div>
        <button class="btn-ataque" onclick="tentarContraAtaque()" style="background-color: #c0392b; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 5px;">⚔️ Contra-Atacar Nobreza</button>
    </div>
</div>

<!-- Script integrado diretamente para garantir o funcionamento imediato -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const tabuleiro = document.getElementById("tabuleiro-labirinto");
        if (!tabuleiro) return;

        const tamanho = 8;
        let gladiadorPos = { x: 0, y: 7 };
        let saidaPos = { x: 7, y: 0 };

        function desenharTabuleiro() {
            tabuleiro.innerHTML = "";
            for (let y = 0; y < tamanho; y++) {
                for (let x = 0; x < tamanho; x++) {
                    const celula = document.createElement("div");
                    celula.style.width = "45px";
                    celula.style.height = "45px";
                    celula.style.backgroundColor = "#1e1e1e";
                    celula.style.display = "flex";
                    celula.style.alignItems = "center";
                    celula.style.justifyContent = "center";
                    celula.style.fontSize = "22px";
                    celula.style.borderRadius = "4px";
                    
                    if (x === gladiadorPos.x && y === gladiadorPos.y) {
                        celula.style.backgroundColor = "#2c3e50";
                        celula.style.border = "2px solid #3498db";
                        celula.innerHTML = "🛡️";
                    } else if (x === saidaPos.x && y === saidaPos.y) {
                        celula.style.backgroundColor = "#d4af37";
                        celula.innerHTML = "🚪";
                    }
                    
                    tabuleiro.appendChild(celula);
                }
            }
        }

        window.moverGladiador = function(direcao) {
            if (direcao === 'cima' && gladiadorPos.y > 0) gladiadorPos.y--;
            if (direcao === 'baixo' && gladiadorPos.y < tamanho - 1) gladiadorPos.y++;
            if (direcao === 'esquerda' && gladiadorPos.x > 0) gladiadorPos.x--;
            if (direcao === 'direita' && gladiadorPos.x < tamanho - 1) gladiadorPos.x++;
            desenharTabuleiro();
        };

        desenharTabuleiro();
    });
</script>
{% endblock %}
