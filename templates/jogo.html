{% extends "base.html" %}

{% block content %}
<div class="game-container">
  <div class="game-header">
    <a href="{{ url_for('painel') }}" class="btn-back">← Painel</a>
    <h2>Fuga dos Plebeus</h2>
  </div>

  <div class="status-panel">
    <div class="stat-box"><strong>Fase:</strong> <span id="fase-txt">1</span>/4</div>
    <div class="stat-box"><strong>Turno:</strong> <span id="turnos-txt">0</span>/20</div>
    <div class="stat-box"><strong>Salvos:</strong> <span id="salvos-txt">0</span>/3</div>
    <div class="stat-box"><strong>Pontos:</strong> <span id="pontos-txt">0</span></div>
  </div>

  <p id="instrucoes" class="game-msg">Selecione um plebeu e clique em uma casa válida para se mover.</p>

  <!-- O TABULEIRO SERÁ DESENHADO AQUI VIA JAVASCRIPT -->
  <div id="tabuleiro" class="board"></div>

  <div class="controls">
    <button id="btn-reiniciar" class="btn-primary">Reiniciar Partida</button>
  </div>

  <div class="legend">
    <span>♟️ Plebeu</span>
    <span>♚ Rei</span>
    <span>♛ Rainha</span>
    <span>♝ Bispo</span>
    <span>⬛ Parede</span>
    <span>🚪 Saída</span>
  </div>
</div>

<script src="{{ url_for('static', filename='game.js') }}"></script>
{% endblock %}
