 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobosan Jogos - Fuga dos Gladiadores</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container-jogo">
        <header class="topo-jogo">
            <h1>🏰 Fuga dos Gladiadores no Castelo</h1>
            <div class="info-painel">
                <span>Gladiadores: <strong id="qtd-gladiadores">4</strong></span>
                <span>Turno: <span id="turno-atual">1</span> / 20</span>
                <a href="{{ url_for('painel') }}" class="btn-voltar">Sair para o Painel</a>
            </div>
        </header>

        <main class="area-batalha">
            <!-- Tabuleiro / Labirinto Estratégico -->
            <div id="tabuleiro-labirinto" class="tabuleiro-grid">
                <!-- As células do labirinto e as peças (Rei, Rainha, Bispo, Soldados, Gladiadores e Saída) serão renderizadas aqui -->
            </div>

            <!-- Painel de Ações Táticas -->
            <div class="painel-comandos">
                <h3>Comandos do Gladiador</h3>
                <div class="botoes-direcao">
                    <button onclick="moverGladiador('cima')" class="btn-acao">⬆️ Cima</button>
                    <div class="botoes-meio">
                        <button onclick="moverGladiador('esquerda')" class="btn-acao">⬅️ Esquerda</button>
                        <button onclick="moverGladiador('direita')" class="btn-acao">➡️ Direita</button>
                    </div>
                    <button onclick="moverGladiador('baixo')" class="btn-acao">⬇️ Baixo</button>
                </div>
                <div class="botoes-combate">
                    <button onclick="tentarContraAtaque()" class="btn-ataque">⚔️ Contra-Atacar Nobreza</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Script de controle do jogo -->
    <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
